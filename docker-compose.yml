services:
  bot-tg-schedule:
    build:
      context: .
      target: runtime
      network: host
    image: ${BOT_IMAGE:-bot-tg-schedule:latest}
    container_name: bot-tg-schedule
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,uid=10001,gid=10001,mode=1777
    environment:
      TZ: Asia/Yekaterinburg
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
