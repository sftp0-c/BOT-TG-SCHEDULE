name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository inputs
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e data/state.json
          git diff --check
          BOT_IMAGE=bot-tg-schedule:ci docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Run isolated tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          tags: bot-tg-schedule:test-${{ github.sha }}
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: bot-tg-schedule:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Verify runtime contents
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp \
            --entrypoint sh bot-tg-schedule:${GITHUB_SHA} -ec '
              test ! -e /app/.env
              test ! -e /app/tests
              test ! -e /app/samples
              test ! -e /app/analysis
              python -m pip check
              python -c "import config, clock, commands, state, schedule_source, schedule_render, bot"
            '
